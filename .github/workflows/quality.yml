name: Portfolio quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile project scripts
        run: python -m compileall -q projects
      - name: Run API Security tests
        run: python -m unittest discover -s projects/crapi-api-security/tests -v
      - name: Run Vulnerability Management tests
        run: python -m unittest discover -s projects/vulnerability-management/tests -v
      - name: Run Threat Intelligence tests
        run: python -m unittest discover -s projects/threat-intelligence/tests -v
